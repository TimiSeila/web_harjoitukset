<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Products</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>
        <div class="header">
            <a href="index.html">
                <img class="logo" src="images/logo.png"/>
            </a>
            <nav class="navbar">
                <a href="products.html" class="link">Products</a>
                <a href="contact.html" class="link">Contact</a>
            </nav>
        </div>
        <div class="products_container">
            <h1>Our Products</h1>
            <div class="products_list"> 
                <div class="product_card">
                    <img class="product_image" src="images/premium.png" alt="product_image">
                    <h4 class="product_heading">Premium Water</h4>
                    <p class="product_paragraph">The most premium water sourced from the cleanest spring</p>
                    <a class="product_button" href="#">Buy Now</a>
                </div>
                <div class="product_card">
                    <img class="product_image" src="images/hero.png" alt="product_image">
                    <h4 class="product_heading">Water</h4>
                    <p class="product_paragraph">Just some good water sourced from the tap</p>
                    <a class="product_button" href="#">Buy Now</a>
                </div>
                <div class="product_card">
                    <img class="product_image" src="images/brown.png" alt="product_image">
                    <h4 class="product_heading">Brown Water</h4>
                    <p class="product_paragraph">...</p>
                    <a class="product_button" href="#">Buy Now</a>
                </div>
            </div>
        </div>
</body>
</html>
